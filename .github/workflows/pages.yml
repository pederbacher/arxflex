# Render the Borgerskolen vignette and publish it on GitHub Pages.
# Enable once in the repository: Settings -> Pages -> Source: "GitHub Actions".
name: Vignette on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/borgerskolen/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:            # run by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                    # one deployment at a time; don't cancel a running one
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install arxflex, the example data and the Jupyter kernel
        run: |
          python -m pip install --upgrade pip
          pip install ".[pandas,plot]" ./examples/borgerskolen \
                      nbformat nbclient ipykernel pyyaml

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render the vignette
        working-directory: examples/borgerskolen
        env:
          MPLBACKEND: Agg
        run: |
          quarto render vignette.py --to html
          mkdir -p "$GITHUB_WORKSPACE/_site"
          cp vignette.html "$GITHUB_WORKSPACE/_site/index.html"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
