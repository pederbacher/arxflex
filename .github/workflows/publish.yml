# Build arxflex and arxflex-borgerskolen and upload them to PyPI with trusted
# publishing (OpenID Connect): no API token is stored anywhere.
#
# Runs when a GitHub release is published. Versions already on PyPI are
# skipped, so a release that bumps only one of the two packages works.
#
# One-time setup on pypi.org, for each of the two projects (as a "pending
# publisher" before the first upload): Account settings -> Publishing ->
# Add a new pending publisher, with
#   PyPI project name: arxflex   (and again: arxflex-borgerskolen)
#   Owner: pederbacher   Repository: arxflex
#   Workflow: publish.yml   Environment: pypi
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:            # run by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdists and wheels of both packages
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist .
          python -m build --outdir dist examples/borgerskolen
          twine check --strict dist/*
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/arxflex/
    permissions:
      id-token: write           # needed for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
